name: Build and Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: aivietnam

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            mkdir -p /opt/aivietnam/media

            docker pull ghcr.io/letuyen-kami/aivietnam:latest

            docker stop aivietnam || true
            docker rm aivietnam || true

            docker run -d \
              --name aivietnam \
              --restart unless-stopped \
              --env-file /var/www/aivietnam/.env \
              -p 3000:3000 \
              -v /opt/aivietnam/media:/app/media \
              ghcr.io/letuyen-kami/aivietnam:latest

            echo "Waiting for app..."
            sleep 15

            curl -f http://localhost:3000 || exit 1

      - name: Discord Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "✅ Deploy Success",
                "description": "AIVietnam deployed successfully",
                "color": 5763719,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "Commit",
                    "value": "${{ github.event.head_commit.message }}"
                  }
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Fail
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ Deploy Failed",
                "description": "AIVietnam deploy failed",
                "color": 15548997
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK }}
